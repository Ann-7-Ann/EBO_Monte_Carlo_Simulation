<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Interactive Beam Simulator with Multiple Mirrors & Beams (Perpendicular Aperture)</title>
<style>
  body { background:#f3f4f6; font-family:sans-serif; padding:20px; }
  #controls { display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  #controls button { padding:6px 10px; border-radius:6px; border:1px solid #cbd5e1; background:#ffffff; cursor:pointer; }
  #controls .hint { color:#475569; font-size:12px; }
  canvas { background:#0f172a; border-radius:6px; cursor:crosshair; display:block; margin:auto; }
</style>
</head>
<body>
<h2>Beam Simulator with Multiple Mirrors</h2>

<div id="controls">
  <button id="addMirrorBtn">Add Mirror</button>
  <button id="clearMirrorsBtn">Clear Mirrors</button>
  <button id="addBeamBtn">Add Beam</button>
  <button id="clearBeamsBtn">Clear Beams</button>
  <span class="hint">Beams: drag endpoints to resize aperture, drag the segment to rotate. Add items by dragging. Right-click a beam/mirror to delete.</span>
</div>

<canvas id="canvas" width="960" height="540"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const width = canvas.width, height = canvas.height;

// Global ray style: SAME color for all beams & reflections
let color = "#FFD166";
let lengthVal = 1000;       // total path length per ray
let maxBounces = 10;        // cap the number of reflections
const EPS = 1e-4;

// --- Beams: multiple aperture segments (perpendicular emit) ---
let beams = [
  // Example beam: vertical aperture segment (rays will emit horizontally)
  { p1: {x:140, y:height/2 - 20}, p2: {x:140, y:height/2 + 20} },
];

// --- Mirrors: multiple segments ---
let mirrors = [
  {x1:400, y1:200, x2:600, y2:300},
  {x1:500, y1:400, x2:800, y2:450}
];

// ---- Helpers ----
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

function distancePointToSegment(px,py,x1,y1,x2,y2){
  const A=px-x1,B=py-y1,C=x2-x1,D=y2-y1;
  const dot=A*C+B*D;
  const lenSq=C*C+D*D;
  const t=Math.max(0, Math.min(1, dot/lenSq));
  const closestX=x1+C*t, closestY=y1+D*t;
  return Math.hypot(px-closestX, py-closestY);
}

function drawGrid(){
  ctx.save(); ctx.globalAlpha=0.06; ctx.strokeStyle="#94a3b8";
  for(let x=0;x<width;x+=50){ctx.beginPath();ctx.moveTo(x+0.5,0);ctx.lineTo(x+0.5,height);ctx.stroke();}
  for(let y=0;y<height;y+=50){ctx.beginPath();ctx.moveTo(0,y+0.5);ctx.lineTo(width,y+0.5);ctx.stroke();}
  ctx.restore();
}

function drawMirrors(){
  mirrors.forEach(m=>{
    ctx.strokeStyle="#00aaff"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(m.x1,m.y1); ctx.lineTo(m.x2,m.y2); ctx.stroke();
    ctx.fillStyle="white";
    ctx.beginPath(); ctx.arc(m.x1,m.y1,6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(m.x2,m.y2,6,0,Math.PI*2); ctx.fill();
  });
}

// Reflection math: v' = v - 2 (v·n) n
function reflectVector(vx,vy,nx,ny){
  const dot = vx*nx + vy*ny;
  return { x: vx - 2*dot*nx, y: vy - 2*dot*ny };
}

// Ray-segment intersection (nearest hit)
function intersectRaySegment(px,py,dx,dy,x1,y1,x2,y2){
  const rdx = dx, rdy = dy;                 // ray direction (unit)
  const sdx = x2 - x1, sdy = y2 - y1;       // segment direction
  const rx = x1 - px, ry = y1 - py;         // from ray origin to segment start
  const denom = rdx*sdy - rdy*sdx;
  if (Math.abs(denom) < 1e-10) return null; // parallel or collinear
  const t = (rx*sdy - ry*sdx) / denom;      // along ray
  const u = (rx*rdy - ry*rdx) / denom;      // along segment [0,1]
  if (t > EPS && u >= 0 && u <= 1) {
    return { t, x: px + rdx*t, y: py + rdy*t };
  }
  return null;
}

function closestIntersection(px,py,dx,dy){
  let best = null;
  for (const m of mirrors) {
    const hit = intersectRaySegment(px,py,dx,dy,m.x1,m.y1,m.x2,m.y2);
    if (hit) {
      if (!best || hit.t < best.t) {
        best = { ...hit, mirror: m };
      }
    }
  }
  return best;
}

// Draw a beam ray segment (incident and reflected use SAME attributes)
function drawBeamRay(x1,y1,x2,y2){
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 1.0;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
}

// Trace a single ray with reflections
function traceAndDrawRay(sx, sy, dx, dy, totalLen, bounceLimit){
  let remaining = totalLen;
  let ox = sx, oy = sy;
  let vx = dx, vy = dy;

  for (let b=0; b<bounceLimit; b++){
    const hit = closestIntersection(ox, oy, vx, vy);
    if (!hit || hit.t > remaining){
      const ex = ox + vx*remaining;
      const ey = oy + vy*remaining;
      drawBeamRay(ox, oy, ex, ey);
      return;
    }
    drawBeamRay(ox, oy, hit.x, hit.y);
    remaining -= hit.t;

    const m = hit.mirror;
    const nx = m.y2 - m.y1;
    const ny = -(m.x2 - m.x1);
    const nmag = Math.hypot(nx, ny);
    const nnx = nx / nmag, nny = ny / nmag;

    const refl = reflectVector(vx, vy, nnx, nny);
    ox = hit.x + refl.x * EPS;
    oy = hit.y + refl.y * EPS;
    vx = refl.x; vy = refl.y;
  }

  const ex = ox + vx*remaining;
  const ey = oy + vy*remaining;
  drawBeamRay(ox, oy, ex, ey);
}

// ---- Emit rays for all beams (PERPENDICULAR to beam segments) ----
function drawAllBeamsRays(){
  beams.forEach(b=>{
    // Beam vector (aperture line)
    const vx = b.p2.x - b.p1.x;
    const vy = b.p2.y - b.p1.y;
    const apertureLen = Math.hypot(vx, vy);

    // Normalized perpendicular direction
    let ndx = vy, ndy = -vx;
    const nmag = Math.hypot(ndx, ndy);
    if (nmag > 0) { ndx /= nmag; ndy /= nmag; } else { ndx = 1; ndy = 0; } // fallback

    // Distribute emit points uniformly along the beam segment itself
    const count = Math.max(2, Math.floor(apertureLen/2)); // dynamic density
    for(let i=0;i<count;i++){
      const t = count===1 ? 0.5 : i/(count-1);
      const sx = b.p1.x + vx*t;
      const sy = b.p1.y + vy*t;
      traceAndDrawRay(sx, sy, ndx, ndy, lengthVal, maxBounces);
    }
  });
}

// ---- Beams UI (aperture segments) ----
function drawBeamsSegments(){
  beams.forEach(b=>{
    // Blue aperture segment (like your screenshot)
    ctx.strokeStyle="#38bdf8"; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(b.p1.x,b.p1.y); ctx.lineTo(b.p2.x,b.p2.y); ctx.stroke();
    ctx.fillStyle="white";
    ctx.beginPath(); ctx.arc(b.p1.x,b.p1.y,6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.p2.x,b.p2.y,6,0,Math.PI*2); ctx.fill();
  });
}

// ---- Add-mirror preview ----
let addMirrorMode = false;
let addMirrorDrag = false;
let mirrorStart = null;
let mirrorCurrent = null;

function drawAddMirrorPreview(){
  if (addMirrorMode && mirrorStart && mirrorCurrent){
    ctx.save();
    ctx.setLineDash([8,6]);
    ctx.strokeStyle = "#7dd3fc"; // light blue preview
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(mirrorStart.x, mirrorStart.y); ctx.lineTo(mirrorCurrent.x, mirrorCurrent.y); ctx.stroke();
    ctx.restore();
  }
}

// ---- Add-beam preview ----
let addBeamMode = false;
let addBeamDrag = false;
let beamStart = null;
let beamCurrent = null;

function drawAddBeamPreview(){
  if (addBeamMode && beamStart && beamCurrent){
    ctx.save();
    ctx.setLineDash([8,6]);
    ctx.strokeStyle = "#86efac"; // light green preview
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(beamStart.x, beamStart.y); ctx.lineTo(beamCurrent.x, beamCurrent.y); ctx.stroke();
    ctx.restore();
  }
}

// ---- Render ----
function render(){
  ctx.clearRect(0,0,width,height);
  drawGrid();
  drawMirrors();
  drawAllBeamsRays();  // emit rays perpendicular to beam segments
  drawBeamsSegments(); // beam aperture UI on top
  drawAddMirrorPreview();
  drawAddBeamPreview();
  requestAnimationFrame(render);
}
render();

// ---- Interactions (dragging, rotating, add/remove mirrors & beams) ----
let dragging = null;    // type string
let dragTarget = null;  // details object

document.getElementById('addMirrorBtn').onclick = () => {
  addMirrorMode = true;
  addMirrorDrag = false;
  mirrorStart = null; mirrorCurrent = null;
};

document.getElementById('clearMirrorsBtn').onclick = () => {
  mirrors = [];
};

document.getElementById('addBeamBtn').onclick = () => {
  addBeamMode = true;
  addBeamDrag = false;
  beamStart = null; beamCurrent = null;
};

document.getElementById('clearBeamsBtn').onclick = () => {
  beams = [];
};

// Mouse down
canvas.onmousedown = e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;

  // Add mirror: start drag-to-place
  if (addMirrorMode) {
    addMirrorDrag = true;
    mirrorStart = {x: mx, y: my};
    mirrorCurrent = {x: mx, y: my};
    return;
  }

  // Add beam: start drag-to-place
  if (addBeamMode) {
    addBeamDrag = true;
    beamStart = {x: mx, y: my};
    beamCurrent = {x: mx, y: my};
    return;
  }

  // Beams: endpoints and rotation
  for (let i=0; i<beams.length; i++){
    const b = beams[i];
    // Endpoints
    if(Math.hypot(mx-b.p1.x,my-b.p1.y)<10){ dragging="beamEnd"; dragTarget={idx:i,pt:'p1'}; return; }
    if(Math.hypot(mx-b.p2.x,my-b.p2.y)<10){ dragging="beamEnd"; dragTarget={idx:i,pt:'p2'}; return; }
  }
  // Beam rotation: near any beam segment
  for (let i=0; i<beams.length; i++){
    const b = beams[i];
    if (distancePointToSegment(mx,my,b.p1.x,b.p1.y,b.p2.x,b.p2.y) < 8){
      dragging = "beamRot"; dragTarget = {idx:i}; return;
    }
  }

  // Mirrors: endpoints and rotation
  for(const m of mirrors){
    if(Math.hypot(mx-m.x1,my-m.y1)<8){ dragging="mirror"; dragTarget={m:m,pt:'x1y1'}; return; }
    if(Math.hypot(mx-m.x2,my-m.y2)<8){ dragging="mirror"; dragTarget={m:m,pt:'x2y2'}; return; }
    if(distancePointToSegment(mx,my,m.x1,m.y1,m.x2,m.y2)<8){ dragging="mirrorRot"; dragTarget=m; return; }
  }
};

// Mouse move
canvas.onmousemove = e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;

  // Add mirror preview update
  if (addMirrorMode && addMirrorDrag && mirrorStart){
    mirrorCurrent = {x: mx, y: my};
    return;
  }

  // Add beam preview update
  if (addBeamMode && addBeamDrag && beamStart){
    beamCurrent = {x: mx, y: my};
    return;
  }

  if(!dragging) return;

  if(dragging==="beamEnd"){
    const {idx, pt} = dragTarget;
    const p = beams[idx][pt];
    p.x=clamp(mx,0,width); p.y=clamp(my,0,height);
  } else if(dragging==="beamRot"){
    const {idx} = dragTarget;
    const b = beams[idx];
    const cx = (b.p1.x + b.p2.x)/2;
    const cy = (b.p1.y + b.p2.y)/2;
    const angle = Math.atan2(my - cy, mx - cx);
    const halfLen = Math.hypot(b.p2.x - b.p1.x, b.p2.y - b.p1.y)/2;
    b.p1.x = cx - Math.cos(angle)*halfLen; b.p1.y = cy - Math.sin(angle)*halfLen;
    b.p2.x = cx + Math.cos(angle)*halfLen; b.p2.y = cy + Math.sin(angle)*halfLen;
  } else if(dragging==="mirror"){
    const m = dragTarget.m;
    if(dragTarget.pt==='x1y1'){ m.x1=clamp(mx,0,width); m.y1=clamp(my,0,height); }
    else { m.x2=clamp(mx,0,width); m.y2=clamp(my,0,height); }
  } else if(dragging==="mirrorRot"){
    const m = dragTarget;
    const cx = (m.x1+m.x2)/2, cy=(m.y1+m.y2)/2;
    const angle = Math.atan2(my-cy, mx-cx);
    const len = Math.hypot(m.x2-m.x1, m.y2-m.y1)/2;
    m.x1 = cx - Math.cos(angle)*len; m.y1 = cy - Math.sin(angle)*len;
    m.x2 = cx + Math.cos(angle)*len; m.y2 = cy + Math.sin(angle)*len;
  }
};

// Mouse up
canvas.onmouseup = e=>{
  // Finalize mirror placement
  if (addMirrorMode && addMirrorDrag && mirrorStart && mirrorCurrent) {
    const {x: x1, y: y1} = mirrorStart;
    const {x: x2, y: y2} = mirrorCurrent;
    if (Math.hypot(x2-x1, y2-y1) > 2) {
      mirrors.push({ x1, y1, x2, y2 });
    }
    addMirrorMode = false; addMirrorDrag = false; mirrorStart = null; mirrorCurrent = null;
  }
  // Finalize beam placement (aperture segment)
  if (addBeamMode && addBeamDrag && beamStart && beamCurrent) {
    const {x: x1, y: y1} = beamStart;
    const {x: x2, y: y2} = beamCurrent;
    if (Math.hypot(x2-x1, y2-y1) > 2) {
      beams.push({ p1: {x: x1, y: y1}, p2: {x: x2, y: y2} });
    }
    addBeamMode = false; addBeamDrag = false; beamStart = null; beamCurrent = null;
  }
  dragging=null; dragTarget=null;
};

// Context menu (right-click) to delete beams or mirrors
canvas.oncontextmenu = e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;

  // Check beams first
  for (let i=0; i<beams.length; i++){
    const b = beams[i];
    if (distancePointToSegment(mx,my,b.p1.x,b.p1.y,b.p2.x,b.p2.y) < 8){
      beams.splice(i,1);
      return;
    }
  }

  // Then check mirrors
  for (let i=0; i<mirrors.length; i++){
    const m = mirrors[i];
    if (distancePointToSegment(mx,my,m.x1,m.y1,m.x2,m.y2) < 8){
      mirrors.splice(i,1);
      return;
    }
  }
};
</script>
</body>
</html>
